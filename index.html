<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Forest — Minimalist Tree Tasks</title>
    <style>
        :root {
            --bg-color: #fafafa;
            --text-color: #171717;
            --border-color: #e5e5e5;
            --accent-color: #737373;
            --hover-color: #f5f5f5;
            --completed-color: #a3a3a3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 4rem 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        .actions {
            display: flex;
            gap: 0.75rem;
        }

        button, label.btn-label {
            background: none;
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--accent-color);
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-block;
        }

        button:hover, label.btn-label:hover {
            background-color: var(--hover-color);
            color: var(--text-color);
            border-color: var(--accent-color);
        }

        .btn-primary {
            background-color: var(--text-color);
            color: var(--bg-color);
            border-color: var(--text-color);
        }

        .btn-primary:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
        }

        #file-import {
            display: none;
        }

        .forest-floor {
            margin-top: 1rem;
        }

        .tree-node {
            margin-top: 0.5rem;
        }

        .node-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0;
            group: hover;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .node-checkbox {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1px solid var(--accent-color);
            border-radius: 4px;
            cursor: pointer;
            display: grid;
            place-content: center;
            transition: all 0.15s ease;
        }

        .node-checkbox:checked {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .node-checkbox:checked::before {
            content: "";
            width: 8px;
            height: 4px;
            border-left: 2px solid var(--bg-color);
            border-bottom: 2px solid var(--bg-color);
            transform: rotate(-45deg) translate(1px, -1px);
        }

        .node-input {
            border: none;
            background: transparent;
            font-size: 0.95rem;
            color: var(--text-color);
            width: 100%;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
        }

        .node-input:focus {
            outline: none;
            background-color: var(--hover-color);
        }

        .node-input.completed {
            color: var(--completed-color);
            text-decoration: line-through;
        }

        .node-tools {
            opacity: 0;
            display: flex;
            gap: 0.25rem;
            transition: opacity 0.15s ease;
        }

        .node-row:hover .node-tools {
            opacity: 1;
        }

        .tool-btn {
            border: none;
            background: none;
            padding: 0.2rem 0.4rem;
            font-size: 0.8rem;
            border-radius: 4px;
        }

        .branches {
            margin-left: 1.1rem;
            border-left: 1px solid var(--border-color);
            padding-left: 0.75rem;
        }

        .empty-state {
            color: var(--completed-color);
            font-size: 0.9rem;
            text-align: center;
            padding: 3rem 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>The Forest</h1>
            <div class="actions">
                <button onclick="exportJSON()">Export</button>
                <label for="file-import" class="btn-label">Import</label>
                <input type="file" id="file-import" accept=".json" onchange="importJSON(event)">
                <button onclick="addTree()" class="btn-primary">+ Plant Tree</button>
            </div>
        </header>

        <div id="forest" class="forest-floor"></div>
    </div>

    <script>
        let forestData = [];

        // Load data on startup
        window.onload = () => {
            const savedData = localStorage.getItem('forestTasks');
            if (savedData) {
                try {
                    forestData = JSON.parse(savedData);
                } catch (e) {
                    forestData = [];
                }
            }
            renderForest();
        };

        function saveToLocalStorage() {
            localStorage.setItem('forestTasks', JSON.stringify(forestData));
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        }

        function addTree() {
            const newTree = {
                id: generateId(),
                text: '',
                checked: false,
                children: []
            };
            forestData.push(newTree);
            renderForest();
            // Focus on the newly created input
            setTimeout(() => {
                const inputs = document.querySelectorAll('.node-input');
                inputs[inputs.length - 1].focus();
            }, 50);
        }

        function findAndModify(nodes, id, action) {
            for (let i = 0; i < nodes.length; i++) {
                if (nodes[i].id === id) {
                    action(nodes, i);
                    return true;
                }
                if (nodes[i].children && nodes[i].children.length > 0) {
                    if (findAndModify(nodes[i].children, id, action)) return true;
                }
            }
            return false;
        }

        function updateNodeText(id, text) {
            findAndModify(forestData, id, (arr, index) => {
                arr[index].text = text;
            });
            saveToLocalStorage();
        }

        function toggleNodeCheck(id, checked) {
            findAndModify(forestData, id, (arr, index) => {
                arr[index].checked = checked;
                // Recursively check/uncheck all children ("leaf by leaf cascading")
                const toggleAllChildren = (node, state) => {
                    node.checked = state;
                    node.children.forEach(child => toggleAllChildren(child, state));
                };
                toggleAllChildren(arr[index], checked);
            });
            renderForest();
        }

        function addChildNode(parentId) {
            findAndModify(forestData, parentId, (arr, index) => {
                const childId = generateId();
                arr[index].children.push({
                    id: childId,
                    text: '',
                    checked: false,
                    children: []
                });
            });
            renderForest();
        }

        function deleteNode(id) {
            findAndModify(forestData, id, (arr, index) => {
                arr.splice(index, 1);
            });
            renderForest();
        }

        function createNodeDOM(node) {
            const nodeEl = document.createElement('div');
            nodeEl.className = 'tree-node';
            nodeEl.dataset.id = node.id;

            const rowEl = document.createElement('div');
            rowEl.className = 'node-row';

            const checkboxWrapper = document.createElement('label');
            checkboxWrapper.className = 'checkbox-wrapper';
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'node-checkbox';
            checkbox.checked = node.checked;
            checkbox.addEventListener('change', (e) => toggleNodeCheck(node.id, e.target.checked));

            checkboxWrapper.appendChild(checkbox);

            const input = document.createElement('input');
            input.type = 'text';
            input.className = `node-input ${node.checked ? 'completed' : ''}`;
            input.value = node.text;
            input.placeholder = 'Write a step...';
            input.addEventListener('input', (e) => updateNodeText(node.id, e.target.value));

            const toolsEl = document.createElement('div');
            toolsEl.className = 'node-tools';

            const addBtn = document.createElement('button');
            addBtn.className = 'tool-btn';
            addBtn.innerText = '+ Sub';
            addBtn.onclick = () => addChildNode(node.id);

            const delBtn = document.createElement('button');
            delBtn.className = 'tool-btn';
            delBtn.innerText = '✕';
            delBtn.onclick = () => deleteNode(node.id);

            toolsEl.appendChild(addBtn);
            toolsEl.appendChild(delBtn);

            rowEl.appendChild(checkboxWrapper);
            rowEl.appendChild(input);
            rowEl.appendChild(toolsEl);
            nodeEl.appendChild(rowEl);

            if (node.children && node.children.length > 0) {
                const branchesEl = document.createElement('div');
                branchesEl.className = 'branches';
                node.children.forEach(child => {
                    branchesEl.appendChild(createNodeDOM(child));
                });
                nodeEl.appendChild(branchesEl);
            }

            return nodeEl;
        }

        function renderForest() {
            const forestContainer = document.getElementById('forest');
            forestContainer.innerHTML = '';

            if (forestData.length === 0) {
                forestContainer.innerHTML = '<div class="empty-state">Your forest is empty. Plant a tree to begin.</div>';
                saveToLocalStorage();
                return;
            }

            forestData.forEach(tree => {
                forestContainer.appendChild(createNodeDOM(tree));
            });

            saveToLocalStorage();
        }

        // JSON handling functions
        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(forestData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "the_forest_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importJSON(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        forestData = importedData;
                        renderForest();
                    } else {
                        alert("Invalid file structure. Make sure it's a file exported from this app.");
                    }
                } catch (err) {
                    alert("Failed to parse JSON file.");
                }
            };
            fileReader.readAsText(event.target.files[0]);
            // Clear input so same file can be uploaded back-to-back if needed
            document.getElementById('file-import').value = '';
        }
    </script>
</body>
</html>
